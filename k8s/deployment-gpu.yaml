# Model Mistress - GPU Worker Deployment
# GPU-accelerated inference workers targeting AMD RX 7900 XTX (RDNA3)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-mistress-gpu
  namespace: model-mistress
  labels:
    app.kubernetes.io/name: model-mistress
    app.kubernetes.io/component: gpu-worker
    model-mistress/workload-type: gpu
  annotations:
    model-mistress/description: "GPU inference workers (AMD ROCm)"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: model-mistress
      app.kubernetes.io/component: gpu-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-mistress
        app.kubernetes.io/component: gpu-worker
        model-mistress/workload-type: gpu
      annotations:
        model-mistress/scrape: "true"
        model-mistress/port: "9090"
        model-mistress/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      # ========== AMD GPU Node Affinity ==========
      # Only schedule on nodes labeled for AMD GPU workloads
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: model-mistress/node-type
                    operator: In
                    values:
                      - gpu
                  - key: amd.com/gpu
                    operator: Exists
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 90
              preference:
                matchExpressions:
                  - key: amd.com/gpu.family
                    operator: In
                    values:
                      - rdna3
            - weight: 80
              preference:
                matchExpressions:
                  - key: amd.com/gpu.gfx-version
                    operator: In
                    values:
                      - "11.0.0"
            - weight: 70
              preference:
                matchExpressions:
                  - key: amd.com/gpu.vram-gb
                    operator: In
                    values:
                      - "24"
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - gpu-worker
                topologyKey: kubernetes.io/hostname
      tolerations:
        - key: amd.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: amd.com/rocm
          operator: Exists
          effect: NoSchedule
      # Ensure only one GPU pod per node by default
      # (controlled by replicas and GPU resource limits)
      initContainers:
        # Wait for GPU node discovery DaemonSet to label the node
        - name: wait-for-gpu-label
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for GPU node label..."
              until node=$(kubectl get node "$NODE_NAME" -o jsonpath='{.metadata.labels.amd\.com/gpu}' 2>/dev/null) && [ -n "$node" ]; do
                echo "GPU label not yet available on $NODE_NAME, retrying..."
                sleep 5
              done
              echo "GPU node label confirmed: $node"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
      containers:
        - name: model-mistress
          image: model-mistress:rocm-latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: false
            capabilities:
              add:
                - SYS_PTRACE  # Required for ROCm profiling
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: model-mistress-config
            - configMapRef:
                name: model-mistress-config-gpu
          env:
            - name: NODE_TYPE
              value: "gpu"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: GPU_COUNT
              valueFrom:
                resourceFieldRef:
                  resource: limits.amd.com/gpu
            - name: CPU_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
            - name: MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
          resources:
            requests:
              cpu: "4"
              memory: "12Gi"
              amd.com/gpu: "1"
            limits:
              cpu: "12"
              memory: "48Gi"
              amd.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: config-volume
              mountPath: /etc/model-mistress
              readOnly: true
            - name: cache-volume
              mountPath: /cache
            - name: models-volume
              mountPath: /models
            - name: rocm-cache
              mountPath: /root/.cache/hip
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: config-volume
          configMap:
            name: model-mistress-config
        - name: cache-volume
          emptyDir:
            sizeLimit: 20Gi
        - name: models-volume
          persistentVolumeClaim:
            claimName: model-mistress-models-pvc
        - name: rocm-cache
          emptyDir:
            sizeLimit: 5Gi
        # Shared memory for ROCm IPC
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
      restartPolicy: Always
