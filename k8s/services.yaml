# Model Mistress - Services
# Load-balanced services for CPU and GPU workers
---
# Primary API service — routes to ALL workers (CPU + GPU)
apiVersion: v1
kind: Service
metadata:
  name: model-mistress
  namespace: model-mistress
  labels:
    app.kubernetes.io/name: model-mistress
    app.kubernetes.io/component: api
  annotations:
    model-mistress/description: "Main API endpoint with load balancing across CPU and GPU workers"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: model-mistress
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  sessionAffinity: None
---
# CPU-only service — routes only to CPU workers
apiVersion: v1
kind: Service
metadata:
  name: model-mistress-cpu
  namespace: model-mistress
  labels:
    app.kubernetes.io/name: model-mistress
    app.kubernetes.io/component: cpu-api
  annotations:
    model-mistress/description: "CPU-only inference endpoint"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: model-mistress
    app.kubernetes.io/component: cpu-worker
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  sessionAffinity: None
---
# GPU-only service — routes only to GPU workers
apiVersion: v1
kind: Service
metadata:
  name: model-mistress-gpu
  namespace: model-mistress
  labels:
    app.kubernetes.io/name: model-mistress
    app.kubernetes.io/component: gpu-api
  annotations:
    model-mistress/description: "GPU-accelerated inference endpoint (AMD ROCm)"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: model-mistress
    app.kubernetes.io/component: gpu-worker
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 300
---
# Headless service for StatefulSet or direct pod discovery
apiVersion: v1
kind: Service
metadata:
  name: model-mistress-headless
  namespace: model-mistress
  labels:
    app.kubernetes.io/name: model-mistress
    app.kubernetes.io/component: headless
  annotations:
    model-mistress/description: "Headless service for DNS-based pod discovery"
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: model-mistress
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
# External access service (NodePort for development/testing)
apiVersion: v1
kind: Service
metadata:
  name: model-mistress-external
  namespace: model-mistress
  labels:
    app.kubernetes.io/name: model-mistress
    app.kubernetes.io/component: external
  annotations:
    model-mistress/description: "External-facing endpoint for API access"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: model-mistress
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      nodePort: 30090
      protocol: TCP
  sessionAffinity: None
