[package]
name = "model-mistress-cli"
version = "0.1.0"
edition = "2021"
description = "ModelMistress CLI/TUI for headless and terminal interaction"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
model-mistress = { path = "../src" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
