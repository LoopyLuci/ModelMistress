[package]
name = "model-mistress-desktop"
version = "0.1.0"
edition = "2021"
description = "ModelMistress desktop shell; all server logic lives in model-mistress."
license = "Apache-2.0"

[dependencies]
model-mistress = { path = "../src" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
anyhow = "1.0"
once_cell = "1"
colored = "2"
tauri = { version = "1", features = ["api-all", "window-all"] }

[build-dependencies]
tauri-build = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true