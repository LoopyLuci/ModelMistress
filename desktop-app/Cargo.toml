[package]
name = "model-mistress-desktop"
version = "0.3.0"
edition = "2021"
description = "ModelMistress desktop shell; all server logic lives in model-mistress."
license = "Apache-2.0"

[dependencies]
model-mistress = { path = "../src" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"] }
axum = "0.7"
futures-util = "0.3"
anyhow = "1.0"
once_cell = "1"
colored = "2"
tauri = { version = "2", features = ["tray-icon"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
